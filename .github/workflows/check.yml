# Renders the Linux side of the templates, which the pre-commit hook on Windows cannot reach.
# Linux only: the hook covers Windows, and Windows runners bill at 2x the minutes.
name: check

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: python3 .github/check.py
      - run: |
          python3 -m pip install tomlkit==0.15.1
          python3 .github/check-codex.py
