# Claude Code statusline (dot_claude/statusline/config.json.tmpl). Per machine, in
# ~/.config/chezmoi/chezmoi.toml:
#   [data.statusline]
#   preset = "lean"   # layout: vesper (the tuned one) | lean | rainbow | classic (p10k's own looks)
#   theme  = "p10k"   # colors: vesper (from themes.toml) | p10k (p10k's default colors)
#   icons  = false    # the terminal font has no Nerd Font glyphs
[statusline]
preset = "vesper"
theme  = "vesper"
icons  = true
