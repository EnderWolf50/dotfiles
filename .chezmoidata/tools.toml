purpose = "Editor: the vim alias and EDITOR"
used_by = "40-aliases, 10-environment"
url     = "https://neovim.io"
winget  = "Neovim.Neovim"

[[tools]]
name    = "lazygit"
check   = "lazygit"
purpose = "git UI (the lg alias)"
used_by = "40-aliases"
