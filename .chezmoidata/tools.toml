# Every program and module the PowerShell profile relies on, in one place, so nothing has to
# be found by opening the fragments one by one. All of them are optional: the profile checks
# before using a tool and skips a missing one silently.
#
# `Show-Tools` in a shell (see `85-tool-status.ps1`) reads this file and reports what is
# installed on the current machine; `Show-Tools -Missing` lists only what is not, and
# `Show-Tools -Install` installs those after asking. After editing, run `chezmoi apply`.
#
# Fields:
#   name     what to call it
#   check    the command (or module) whose presence means "installed"; left out when it cannot
#            be checked, such as a font
#   kind     "command" (default) or "module"
#   purpose  what it does here
#   used_by  the fragment or feature that needs it
#   url      home page
#   winget / scoop / npm / psgallery / go   how to install it, tried in that order. A scoop
#            value may be `bucket/app`; the bucket is added first. A go value is a module path,
#            built with `go install` into ~/.local/bin (mise's GOBIN changes with each Go).
#   note     anything else worth knowing
#
# Keep this in step with the code: a new `has <tool>`, `Set-SafeAlias` target or
# `Import-OptionalModule` in a fragment needs an entry here.

[[tools]]
name    = "PowerShell 7"
check   = "pwsh"
purpose = "The shell this profile is written for"
used_by = "everything"
url     = "https://github.com/PowerShell/PowerShell"
winget  = "Microsoft.PowerShell"
note    = "Windows PowerShell 5.1 does not read this profile; herdr 0.9.2 and later start pwsh by default."

[[tools]]
name    = "chezmoi"
check   = "chezmoi"
purpose = "Applies this repository"
used_by = "the dotfiles themselves"
url     = "https://www.chezmoi.io"
winget  = "twpayne.chezmoi"

[[tools]]
name    = "Git for Windows"
check   = "git"
purpose = "git, plus the Unix tools aliased in PowerShell: head, tail, wc, sed, awk, xargs, cut, tr, uniq, env, printenv, less, tig"
used_by = "45-unix-tools"
url     = "https://gitforwindows.org"
winget  = "Git.Git"

[[tools]]
name    = "starship"
check   = "starship"
purpose = "The prompt"
used_by = "20-prompt"
url     = "https://starship.rs"
winget  = "Starship.Starship"

[[tools]]
name    = "eza"
check   = "eza"
purpose = "ls, ll, la, lt and tree, with icons and the theme colors"
used_by = "50-ls"
url     = "https://github.com/eza-community/eza"
winget  = "eza-community.eza"

[[tools]]
name    = "fd"
check   = "fd"
purpose = "Directory list for Alt+c (PSFzf's own default is very slow on Windows)"
used_by = "30-readline"
url     = "https://github.com/sharkdp/fd"
winget  = "sharkdp.fd"

[[tools]]
name    = "fzf"
check   = "fzf"
purpose = "The fuzzy finder behind Ctrl+t, Ctrl+r and Alt+c"
used_by = "30-readline"
url     = "https://github.com/junegunn/fzf"
winget  = "junegunn.fzf"

[[tools]]
name      = "PSFzf"
check     = "PSFzf"
kind      = "module"
purpose   = "Ctrl+t, Ctrl+r and Alt+c key bindings for fzf"
used_by   = "30-readline"
url       = "https://github.com/kelleyma49/PSFzf"
psgallery = "PSFzf"

[[tools]]
name    = "zoxide"
check   = "zoxide"
purpose = "Jump to frequent directories: z and zi"
used_by = "80-tools"
url     = "https://github.com/ajeetdsouza/zoxide"
winget  = "ajeetdsouza.zoxide"

[[tools]]
name    = "mise"
check   = "mise"
purpose = "Per-directory tool versions and PATH"
used_by = "80-tools"
url     = "https://mise.jdx.dev"
winget  = "jdx.mise"

[[tools]]
name    = "carapace"
check   = "carapace"
purpose = "Tab completion for about a thousand commands, styled by the theme"
used_by = "30-readline"
url     = "https://carapace.sh"
winget  = "rsteube.Carapace"
scoop   = "extras/carapace-bin"

[[tools]]
name    = "inshellisense"
check   = "is"
purpose = "Extra completion specs that carapace borrows when it has none of its own"
used_by = "30-readline (CARAPACE_BRIDGES)"
url     = "https://github.com/microsoft/inshellisense"
