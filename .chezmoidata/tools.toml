[[tools]]
name    = "gsudo"
check   = "gsudo"
purpose = "sudo for Windows"
used_by = "80-tools"
url     = "https://github.com/gerardog/gsudo"
winget  = "gerardog.gsudo"

[[tools]]
name    = "gsudoModule"
check   = "gsudoModule"
kind    = "module"
purpose = "PowerShell wrapper for gsudo (scriptblocks, the current directory)"
used_by = "80-tools"
url     = "https://github.com/gerardog/gsudo"
note    = "Installed together with gsudo."

[[tools]]
name    = "bat"
check   = "bat"
