# Every program and module the PowerShell profile relies on, in one place, so nothing has to
# be found by opening the fragments one by one. All of them are optional: the profile checks
# before using a tool and skips a missing one silently.
#
# `Show-Tools` in a shell (see `85-tool-status.ps1`) reads this file and reports what is
# installed on the current machine; `Show-Tools -Missing` lists only what is not, and
# `Show-Tools -Install` installs those after asking. After editing, run `chezmoi apply`.
#
# Fields:
#   name     what to call it
#   check    the command (or module) whose presence means "installed"; left out when it cannot
#            be checked, such as a font
#   kind     "command" (default) or "module"
#   purpose  what it does here
#   used_by  the fragment or feature that needs it
#   lang     a language from `languages` (chezmoi init); the tool is listed only on machines that chose it
#   url      home page
#   winget / scoop / npm / psgallery / go   how to install it, tried in that order. A scoop
#            value may be `bucket/app`; the bucket is added first. An npm value is a package on the npm registry,
#            installed with `pnpm add -g` so a Node upgrade keeps it. A go value is a module path,
#            built with `go install` into ~/.local/bin (mise's GOBIN changes with each Go).
#   brew     the Homebrew formula on Linux / WSL; `run_before_install-tools.sh` installs the
#            missing ones on every apply
#   cask     the Homebrew cask instead, for a tool that ships as one (installed with --cask)
#            Linux falls back to `npm` (pnpm add -g), then `go` (go install, once mise has Go), for a tool with neither
#   os       "windows" or "linux" for a tool only that OS uses; the other OS skips it. Without `os`, a
#            tool needs an install field for each OS (winget / scoop / npm / psgallery / go on
#            Windows, brew / cask / npm / go on Linux), or none at all when `note` says how to install
#            it; `.github/check.py` enforces this
#   after    what to do once after installing it; the Linux install script and `Show-Tools -Install`
#            print it for each tool they just installed
#   note     anything else worth knowing
#
# Keep this in step with the code: a new `has <tool>`, alias target or
# `Import-OptionalModule` in a fragment needs an entry here.

[[tools]]
name    = "PowerShell 7"
check   = "pwsh"
purpose = "The shell this profile is written for"
used_by = "everything"
url     = "https://github.com/PowerShell/PowerShell"
os      = "windows"
winget  = "Microsoft.PowerShell"
note    = "Windows PowerShell 5.1 does not read this profile; herdr 0.9.2 and later start pwsh by default."

