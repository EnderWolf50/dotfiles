# Global agent skills installed with the `skills` CLI (https://skills.sh), one entry per source repo.
# `chezmoi apply` runs run_onchange_after_sync-skills whenever this list changes (and once a day): it
# installs every skill listed here and removes any CLI-installed global skill that is not. Skills
# installed by hand without a source (plugin ones) are left alone.
# `paths` are the skill folders inside the repo; the skill's name is the folder's name. The script
# sparse-clones only those folders: `skills add owner/repo` clones the whole repository, and cli/cli
# is 43 MB for one SKILL.md.
# ~/.agents/.skill-lock.json stays the CLI's own file and is not tracked here.
# `personal = true` entries install only when this machine has data.personal = true.

[[skills]]
source = "mattpocock/skills"
paths = [
  "skills/engineering/ask-matt",
  "skills/engineering/code-review",
  "skills/engineering/codebase-design",
  "skills/engineering/diagnosing-bugs",
  "skills/engineering/domain-modeling",
  "skills/productivity/grill-me",
  "skills/engineering/grill-with-docs",
  "skills/productivity/grilling",
  "skills/productivity/handoff",
  "skills/engineering/implement",
  "skills/engineering/implement-spec",
  "skills/engineering/improve-codebase-architecture",
  "skills/engineering/pr",
  "skills/engineering/prototype",
  "skills/engineering/research",
  "skills/engineering/retro",
  "skills/engineering/setup-matt-pocock-skills",
  "skills/engineering/tdd",
  "skills/productivity/teach",
  "skills/productivity/to-questionnaire",
  "skills/engineering/to-spec",
  "skills/engineering/to-tickets",
  "skills/engineering/triage",
