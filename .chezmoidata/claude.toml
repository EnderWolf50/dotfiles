# Claude Code settings this repo keeps the same on every machine (dot_claude/modify_settings.json).
# ~/.claude/settings.json belongs to Claude Code; every key not listed here is left as the machine has it,
# including autoMode's environment (learned per machine and project) and the herdr hook (installed by herdr itself).
# theme and statusLine are set in the template from the theme and statusline data.

# set: top-level keys owned by this repo, written on every apply.
[claude.set]
language                = "繁體中文"
askUserQuestionTimeout  = "never"
switchModelsOnFlag      = true
inputNeededNotifEnabled = true
autoUpdatesChannel      = "latest"
# claude.ai's skills and plugins stay out: document-skills comes from its marketplace instead.
# Turning these off moves what was synced to ~/.claude/{skills,plugins}/.trash/ on the next start.
syncClaudeAiSkills      = false
syncClaudeAiPlugins     = false

# merge: keys written inside an object on every apply; the other keys of that object stay as they are.
[claude.merge.permissions]
defaultMode = "auto"

[claude.merge.env]
# Only Claude Code sessions get this env: lefthook prints nothing unless a hook fails, keeping commit output short.
LEFTHOOK_OUTPUT               = "failure"
# Task-tracking tools (TaskCreate and the rest) on every model, not only the ones Claude Code turns them on for.
CLAUDE_CODE_ENABLE_TODO_TOOLS = "1"

[claude.merge.worktree]
baseRef = "fresh"

[claude.merge.modelSettings."claude-sonnet-5-5"]
effortLevel = "high"

[claude.merge.extraKnownMarketplaces."anthropic-agent-skills"]
source = { source = "github", repo = "anthropics/skills" }

# Shared native plugins and their marketplaces live in .chezmoidata/plugins.toml.

# append: list entries added to an object's list when missing; the machine's own entries stay.
# Asked first even in auto mode: TinyFish agent and browser runs bill per step / minute (search and fetch are free).
[claude.append.permissions]
ask = ["Bash(tinyfish agent:*)", "Bash(tinyfish browser:*)", "PowerShell(tinyfish agent:*)", "PowerShell(tinyfish browser:*)"]

# Auto-mode classifier exceptions (prose, read by the classifier; "$defaults" keeps the built-in list).
# permissions.allow cannot cover these: ~/.claude is a protected path, and a cwd-free Bash rule would
# allow the same git commands in every repo. The classifier denied each case in the user's own repos
# ("Self-Modification" x2, "Irreversible Local Destruction" x3, 2026-10 retro).
[claude.append.autoMode]
allow = [
  "$defaults",
  "Own-repo cleanup: in the user's own repos (EnderWolf50/dotfiles at ~/.local/share/chezmoi with its worktrees under ~/.local/share/.wt/, EnderWolf50/skills at D:\\skills, EnderWolf50/claude-plugins at D:\\claude-plugins), `git worktree remove` of a clean worktree and `git branch -D` of a branch are allowed when that branch is merged or its commits are on origin, since GitHub keeps every commit.",
  "Own plugin edits: editing files of the user's own EnderWolf50/claude-plugins plugins under ~/.claude/plugins/marketplaces/enderwolf50/ or ~/.claude/plugins/cache/enderwolf50/ is allowed when the user asked for that change; it adds no permission rule, hook or guard bypass.",
]

# mcp: user-scope MCP servers (they live in ~/.claude.json, not settings.json), registered by
# run_onchange_after_claude-mcp whenever this list changes.
# playwright replaces the playwright@claude-plugins-official plugin, whose server shares one Chrome profile:
# a second session failed with "Browser is already in use ... use --isolated". --isolated keeps
# each session's profile in memory.
[claude.mcp.playwright]
command = "npx"
args    = ["-y", "@playwright/mcp@latest", "--isolated"]

# playwright-ext drives the user's own running Edge/Chrome tabs, logged in to webmail and the like,
# through the Playwright Extension (Chrome Web Store id mmlmfjhmonkocbjadbfplnigmagldckm). It is an MCP
# server, not a CLI, because it holds that browser connection open across calls. The browser asks to
# approve each connection; PLAYWRIGHT_MCP_EXTENSION_TOKEN (per browser profile, from the extension's
# status page) skips that, and stays a machine-local env var, never committed here.
[claude.mcp.playwright-ext]
command = "npx"
args    = ["-y", "@playwright/mcp@latest", "--extension"]

# windows.args are appended on Windows only, a leading ~/ becoming the home directory. The user's browser is
# Brave, where the extension is installed; without these the server looks for it in Chrome's user data and stops
# with "Playwright Extension not found" (playwright-core createExtensionBrowser).
[claude.mcp.playwright-ext.windows]
args = [
  "--executable-path", "~/AppData/Local/BraveSoftware/Brave-Browser/Application/brave.exe",
  "--user-data-dir", "~/AppData/Local/BraveSoftware/Brave-Browser/User Data",
]

# local: plugins and marketplaces some machines keep on purpose. run_after_claude-settings-drift
# lists every settings.json plugin or marketplace this file does not know, except these.
[claude.local]
plugins      = ["win-toast@enderwolf50"]
marketplaces = []

# seed: written only when the machine has no value for that key yet, so /plugin on one machine is not
# undone by the next apply. win-toast is left out on purpose (see [claude.local]).
[claude.seed.enabledPlugins]
"cc-plugin-you-should-know@builtin"        = true
"document-skills@anthropic-agent-skills"   = true
