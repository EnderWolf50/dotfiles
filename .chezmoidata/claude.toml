# Claude Code settings this repo keeps the same on every machine (dot_claude/modify_settings.json).
# ~/.claude/settings.json belongs to Claude Code; every key not listed here is left as the machine has it,
# including autoMode (learned per machine and project) and the herdr hook (installed by herdr itself).
# theme and statusLine are set in the template from the theme and statusline data.

# set: top-level keys owned by this repo, written on every apply.
[claude.set]
language                = "繁體中文"
askUserQuestionTimeout  = "never"
switchModelsOnFlag      = true
inputNeededNotifEnabled = true
autoUpdatesChannel      = "latest"
# claude.ai's skills and plugins stay out: document-skills comes from its marketplace instead.
# Turning these off moves what was synced to ~/.claude/{skills,plugins}/.trash/ on the next start.
syncClaudeAiSkills      = false
syncClaudeAiPlugins     = false

# merge: keys written inside an object on every apply; the other keys of that object stay as they are.
[claude.merge.permissions]
defaultMode = "auto"

# security-guidance reviews default to the newest Opus; Sonnet keeps most of the catch at a fraction of the usage.
[claude.merge.env]
SECURITY_REVIEW_MODEL = "claude-sonnet-5-5"
SG_AGENTIC_MODEL      = "claude-sonnet-5-5"
# Only Claude Code sessions get this env: lefthook prints nothing unless a hook fails, keeping commit output short.
LEFTHOOK_OUTPUT       = "failure"

[claude.merge.worktree]
baseRef = "fresh"

[claude.merge.modelSettings."claude-sonnet-5-5"]
effortLevel = "high"

[claude.merge.extraKnownMarketplaces."anthropic-agent-skills"]
source = { source = "github", repo = "anthropics/skills" }

[claude.merge.extraKnownMarketplaces."enderwolf50"]
autoUpdate = true
source = { source = "github", repo = "EnderWolf50/claude-plugins" }

[claude.merge.extraKnownMarketplaces."impeccable"]
autoUpdate = true
source = { source = "github", repo = "pbakaus/impeccable" }

[claude.merge.extraKnownMarketplaces."ponytail"]
source = { source = "github", repo = "DietrichGebert/ponytail" }

# append: list entries added to an object's list when missing; the machine's own entries stay.
# Asked first even in auto mode: TinyFish agent and browser runs bill per step / minute (search and fetch are free).
[claude.append.permissions]
ask = ["Bash(tinyfish agent:*)", "Bash(tinyfish browser:*)", "PowerShell(tinyfish agent:*)", "PowerShell(tinyfish browser:*)"]

# mcp: user-scope MCP servers (they live in ~/.claude.json, not settings.json), registered by
# run_onchange_after_claude-mcp whenever this list changes. semble is one despite the CLI-first rule:
# its server keeps the index in memory, while the CLI rescans the repo on every call (~20 s in D:\CRM).
[claude.mcp.semble]
command = "uvx"
args    = ["--from", "semble[mcp]@latest", "semble"]

# lsp: the LSP plugin for each language. On a machine whose chezmoi config has `languages` (asked by
# `chezmoi init`), every apply turns on the plugins of the chosen languages and turns the rest off.
[claude.lsp]
c-cpp      = "clangd-lsp@claude-plugins-official"
csharp     = "csharp-lsp@claude-plugins-official"
go         = "gopls-lsp@claude-plugins-official"
java       = "jdtls-lsp@claude-plugins-official"
kotlin     = "kotlin-lsp@claude-plugins-official"
python     = "pyright-lsp@claude-plugins-official"
rust       = "rust-analyzer-lsp@claude-plugins-official"
swift      = "swift-lsp@claude-plugins-official"
typescript = "typescript-lsp@claude-plugins-official"

# local: plugins and marketplaces some machines keep on purpose. run_after_claude-settings-drift
# lists every settings.json plugin or marketplace this file does not know, except these.
[claude.local]
plugins      = ["win-toast@enderwolf50"]
marketplaces = []

# seed: written only when the machine has no value for that key yet, so /plugin on one machine is not
# undone by the next apply. win-toast is left out on purpose (see [claude.local]).
[claude.seed.enabledPlugins]
"cc-plugin-you-should-know@builtin"        = true
"document-skills@anthropic-agent-skills"   = true
"impeccable@impeccable"                    = true
"playwright@claude-plugins-official"       = true
"ponytail@ponytail"                        = true
"search-tools@enderwolf50"                 = true
"security-guidance@claude-plugins-official" = true
