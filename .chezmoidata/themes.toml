# Color scheme for everything that has colors: PSReadLine, fzf, carapace, eza, herdr, tmux,
# starship, lazygit, delta, bump, pathed and enved.
# This is the only place colors are written down. Templates turn it into
#   - `$Theme` in the PowerShell profile (`.chezmoitemplates/pwsh/15-theme.ps1`),
#   - carapace's `styles.json` (`AppData/Roaming/carapace/styles.json.tmpl`).
# After editing, run `chezmoi apply`.
#
# To change theme: set `theme` below, or per machine in `~/.config/chezmoi/chezmoi.toml`:
#   [data]
#   theme = "other"
# To add a theme: copy `[themes.vesper.palette]`, rename it, and give every key a new color.
# The keys are roles, not color names (`accent` is whatever the theme's main accent is), so
# the `[roles.*]` tables below work unchanged for any palette with the same keys.
#
# A role value is a list of words separated by spaces:
#   - a palette key (`accent`) or a literal `#rrggbb`; `fg:` / `bg:` in front picks the layer
#     (foreground by default; bg is not understood by carapace),
#   - the modifiers `bold`, `dim`, `italic`, `underline`,
#   - anything else is passed through as-is (fzf uses `-1` for "the terminal's own color").

theme = "vesper"

# Vesper: https://github.com/raunofreiberg/vesper (values from its official theme file).
[themes.vesper]
herdr = "vesper"   # herdr ships a Vesper theme; a theme without this line uses [roles.herdr]

[themes.vesper.palette]
bg        = "#101010"   # background
fg        = "#ffffff"   # main text
accent    = "#ffc799"   # peach: functions, numbers, types, focus
accent2   = "#99ffe4"   # mint: strings, "good"
danger    = "#ff8080"   # errors, "bad"
subtle    = "#a0a0a0"   # keywords, punctuation
muted     = "#8b8b8b"   # secondary text, descriptions
faint     = "#505050"   # borders, line numbers
comment   = "#575757"   # #8b8b8b at 58% alpha blended over the background
selection = "#333333"   # selected row background

# PSReadLine: the keys of `Set-PSReadLineOption -Colors`.
[roles.psreadline]
Command                = "accent"
Parameter              = "subtle"
Operator               = "subtle"
Keyword                = "subtle"
String                 = "accent2"
Variable               = "fg"
Number                 = "accent"
Type                   = "accent"
Member                 = "fg"
Default                = "fg"
Error                  = "danger"
Emphasis               = "accent"
Comment                = "comment"
Selection              = "fg:bg bg:accent"
InlinePrediction       = "italic muted"
ContinuationPrompt     = "faint"
ListPrediction         = "accent"
ListPredictionSelected = "bg:selection"
ListPredictionTooltip  = "muted"

# fzf: the entries of `--color=`. Values are colors only, no modifiers.
[roles.fzf]
bg        = "-1"
fg        = "fg"
hl        = "accent"
"fg+"     = "fg"
"bg+"     = "selection"
"hl+"     = "accent"
info      = "muted"
prompt    = "accent2"
pointer   = "accent"
marker    = "accent2"
spinner   = "accent"
header    = "muted"
border    = "faint"
gutter    = "-1"
query     = "fg"
separator = "faint"
scrollbar = "faint"
label     = "muted"

# carapace: the keys of `styles.json`. No `bg:` here.
[roles.carapace]
Value            = "fg"
Description      = "muted"
Error            = "bold danger"
Usage            = "muted"
KeywordPositive  = "accent2"
KeywordNegative  = "danger"
KeywordAmbiguous = "accent"
KeywordUnknown   = "muted"
FlagNoArg        = "subtle"
FlagOptArg       = "accent2"
FlagArg          = "accent"
FlagMultiArg     = "italic accent"
Highlight1       = "accent"
Highlight2       = "accent2"
Highlight3       = "danger"
Highlight4       = "subtle"
Highlight5       = "fg"
Highlight6       = "dim accent"
Highlight7       = "dim accent2"
Highlight8       = "dim danger"
Highlight9       = "dim subtle"
Highlight10      = "dim fg"

# eza: the codes of `EZA_COLORS` (see `man eza_colors`). Types eza has no code for keep
# eza's own built-in colors.
[roles.eza]
di = "bold accent"        # directories
ex = "accent2"            # executables
fi = "fg"                 # regular files
ln = "subtle"             # symlinks
lp = "subtle"             # symlink target path
or = "danger"             # symlinks with no target
pi = "muted"              # named pipes
so = "muted"              # sockets
bd = "muted"              # block devices
cd = "muted"              # character devices
sp = "muted"              # special files
mp = "accent"             # mount points
ur = "accent"             # permissions: user read / write / execute
uw = "danger"
ux = "accent2"
ue = "accent2"
gr = "accent"             # group
gw = "danger"
gx = "accent2"
tr = "accent"             # others
tw = "danger"
tx = "accent2"
su = "bold danger"        # setuid, setgid, sticky
sf = "bold danger"
xa = "muted"              # extended attribute indicator
sn = "fg"                 # size number
sb = "muted"              # size unit
uu = "accent"             # you / root / another user
uR = "danger"
un = "muted"
gu = "accent"             # your group / root's group / another group
gR = "danger"
gn = "muted"
lc = "muted"              # hard link count
lm = "accent"             # hard link count, when two or more
ga = "accent2"            # git: new / modified / deleted / renamed / type change / ignored / conflicted
gm = "accent"
gd = "danger"
gv = "accent2"
gt = "accent"
gi = "faint"
gc = "danger"
Gm = "accent2"            # git branch: main / other / clean / dirty
Go = "subtle"
Gc = "accent2"
Gd = "danger"
xx = "faint"              # punctuation
da = "subtle"             # date
in = "muted"              # inode
bl = "muted"              # blocks
hd = "underline subtle"   # table header
cc = "danger"             # escaped characters in names
im = "accent2"            # images, video, music
vi = "accent2"
mu = "accent2"
lo = "accent2"
cr = "danger"             # keys and certificates
do = "fg"                 # documents
co = "accent"             # compressed
tm = "muted"              # temporary
cm = "muted"              # compilation artifacts
bu = "accent"             # build files
sc = "fg"                 # source code

# herdr: the `[theme.custom]` tokens, used only when the theme has no `herdr = "..."` built-in.
# The ones named after colors (mauve, green, ...) map to the closest palette role.
[roles.herdr]
accent        = "accent"
panel_bg      = "bg"
sidebar_bg    = "bg"
active_row_bg = "selection"
selection_bg  = "selection"
surface0      = "selection"
surface1      = "faint"
surface_dim   = "bg"
overlay0      = "faint"
overlay1      = "muted"
text          = "fg"
subtext0      = "subtle"
mauve         = "accent"
green         = "accent2"
yellow        = "accent"
red           = "danger"
blue          = "subtle"
teal          = "accent2"
peach         = "accent"
# lazygit: the keys of `gui.theme` (each becomes a list: colors plus modifiers such as bold).
# The *BgColor keys are background colors.
[roles.lazygit]
activeBorderColor               = "accent bold"
inactiveBorderColor             = "faint"
searchingActiveBorderColor      = "accent2 bold"
optionsTextColor                = "muted"
selectedLineBgColor             = "selection"
inactiveViewSelectedLineBgColor = "bold"
cherryPickedCommitFgColor       = "bg"
cherryPickedCommitBgColor       = "accent2"
markedBaseCommitFgColor         = "bg"
markedBaseCommitBgColor         = "accent"
unstagedChangesColor            = "danger"
defaultFgColor                  = "default"

# delta: style keys of the `[delta]` section in .gitconfig. A delta style is
# "[foreground] [background] [attributes]"; decoration styles also take box / ul / ol.
# The +/- line backgrounds keep delta's defaults: the palette has no tinted green/red.
[roles.delta]
file-style                  = "bold accent"
file-decoration-style       = "faint ul"
hunk-header-decoration-style = "faint box"
line-numbers-zero-style     = "faint"
line-numbers-minus-style    = "danger"
line-numbers-plus-style     = "accent2"
line-numbers-left-style     = "faint"
line-numbers-right-style    = "faint"

# bump: the [theme] of ~/.config/bump/config.toml. The row backgrounds are dark tints of the
# palette over `bg` (plain, then under the cursor), so they are written as colors.
[roles.bump]
accent            = "accent"
dim               = "muted"
faint             = "faint"
ok                = "accent2"
bad               = "danger"
major             = "danger"
minor             = "accent"
patch             = "accent2"
other             = "subtle"
row_cursor        = "#262626"
row_picked        = "#16241f"   # accent2 tint: picked
row_picked_cursor = "#223a30"
row_chosen        = "#3a2c12"   # accent tint: picked at a version other than the latest
row_chosen_cursor = "#4d3b19"

# pathed: the [theme] of ~/.config/pathed/config.toml; row backgrounds as for bump.
[roles.pathed]
accent             = "accent"
dim                = "muted"
faint              = "faint"
ok                 = "accent2"
bad                = "danger"
warn               = "accent"
row_cursor         = "#262626"
row_added          = "#16241f"   # accent2 tint
row_added_cursor   = "#223a30"
row_edited         = "#3a2c12"   # accent tint
row_edited_cursor  = "#4d3b19"
row_removed        = "#2e1616"   # danger tint
row_removed_cursor = "#432020"

# enved: the [theme] of ~/.config/enved/config.toml; the same as pathed's (they share the
# look). warn also marks system variables.
[roles.enved]
accent             = "accent"
dim                = "muted"
faint              = "faint"
ok                 = "accent2"
bad                = "danger"
warn               = "accent"
row_cursor         = "#262626"
row_added          = "#16241f"   # accent2 tint
row_added_cursor   = "#223a30"
row_edited         = "#3a2c12"   # accent tint
row_edited_cursor  = "#4d3b19"
row_removed        = "#2e1616"   # danger tint
row_removed_cursor = "#432020"
